name: Hourly Reminder Cron

# Triggers /api/cron/daily-reminder once every hour. The endpoint iterates
# every user with daily_reminder_enabled=true and:
#   - resolves their personal course window (start date + duration)
#   - skips anyone outside their own course range (pre-start or post-end)
#   - looks up the curriculum topics for THEIR Day N (not the cohort's)
#   - filters the email body to only the domains they selected
#   - matches their custom reminder times against their local timezone hour
# All user-preference handling happens server-side — the workflow only
# needs to ping reliably and authenticate.

on:
  schedule:
    - cron: '0 * * * *' # Top of every hour, UTC
  workflow_dispatch: # Allow manual triggering from the GitHub UI

jobs:
  ping-reminder-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Daily Reminder API
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SITE_URL or CRON_SECRET secret is not set"
            exit 1
          fi
          curl --fail-with-body \
               --max-time 240 \
               --retry 2 \
               --retry-delay 10 \
               --retry-all-errors \
               -X GET "${SITE_URL%/}/api/cron/daily-reminder" \
               -H "Authorization: Bearer ${CRON_SECRET}" \
               -H "Accept: application/json"

  ping-brief-cron:
    # Same hourly cadence — the route gates internally on each user's local
    # 07:00, so this fires for any timezone exactly once per day.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Daily Brief Email API
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SITE_URL or CRON_SECRET secret is not set"
            exit 1
          fi
          curl --fail-with-body \
               --max-time 240 \
               --retry 2 \
               --retry-delay 10 \
               --retry-all-errors \
               -X GET "${SITE_URL%/}/api/cron/daily-brief-email" \
               -H "Authorization: Bearer ${CRON_SECRET}" \
               -H "Accept: application/json"
